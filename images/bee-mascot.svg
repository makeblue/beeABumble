<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Wings (behind body) -->
  <ellipse cx="65" cy="70" rx="52" ry="38" fill="rgba(220,235,255,0.82)" stroke="#333" stroke-width="3.5"/>
  <ellipse cx="75" cy="110" rx="42" ry="28" fill="rgba(220,235,255,0.7)" stroke="#333" stroke-width="3"/>
  <!-- Wing veins -->
  <line x1="65" y1="45" x2="50" y2="80" stroke="#aac" stroke-width="1.2" opacity="0.6"/>
  <line x1="65" y1="45" x2="75" y2="82" stroke="#aac" stroke-width="1.2" opacity="0.6"/>
  <line x1="65" y1="45" x2="40" y2="72" stroke="#aac" stroke-width="1.2" opacity="0.6"/>

  <!-- Body (oval, tilted) -->
  <ellipse cx="128" cy="138" rx="55" ry="68" fill="#FFD700" stroke="#222" stroke-width="4" transform="rotate(-15,128,138)"/>

  <!-- Stripes -->
  <clipPath id="body-clip">
    <ellipse cx="128" cy="138" rx="55" ry="68" transform="rotate(-15,128,138)"/>
  </clipPath>
  <g clip-path="url(#body-clip)">
    <rect x="80" y="108" width="115" height="24" fill="#1a1a1a" transform="rotate(-15,128,138)"/>
    <rect x="80" y="144" width="115" height="24" fill="#1a1a1a" transform="rotate(-15,128,138)"/>
    <rect x="80" y="180" width="115" height="18" fill="#1a1a1a" transform="rotate(-15,128,138)"/>
  </g>

  <!-- Body outline on top -->
  <ellipse cx="128" cy="138" rx="55" ry="68" fill="none" stroke="#222" stroke-width="4" transform="rotate(-15,128,138)"/>

  <!-- Face (smiley) -->
  <circle cx="148" cy="118" r="3" fill="#1a1a1a"/>
  <circle cx="156" cy="115" r="3" fill="#1a1a1a"/>
  <path d="M144,124 Q152,131 160,125" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Antennae -->
  <line x1="118" y1="75" x2="105" y2="48" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <circle cx="104" cy="45" r="5" fill="#FFD700" stroke="#222" stroke-width="2.5"/>
  <line x1="130" y1="72" x2="130" y2="44" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <circle cx="130" cy="41" r="5" fill="#FFD700" stroke="#222" stroke-width="2.5"/>
</svg>
